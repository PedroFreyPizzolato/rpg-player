name: Publish Docker Image

# Docker publishing workflow - gated by successful build-and-test completion
# This ensures images are only published after tests pass on master
on:
  # Triggered after successful build-and-test on master
  # Note: The branches filter checks workflow_run.head_branch, which is the source branch
  # of the triggering workflow. For PRs targeting master, head_branch is the PR source
  # branch (not master), so this filter already excludes PR-triggered builds. Only direct
  # pushes to master will have head_branch == 'master' and trigger this workflow.
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches:
      - master
  # Also trigger on version tags (v*) for releases
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arif-banai/musicbot

jobs:
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only run if the triggering workflow succeeded (for workflow_run events)
    # For tag pushes, always run
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    
    permissions:
      contents: read
      packages: write  # Required for pushing to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # For workflow_run events, checkout the commit that triggered the original workflow
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0  # Full history needed for git commands

      - name: Extract metadata
        id: metadata
        run: |
          # Extract project version (first <version> tag, which is the project version)
          VERSION=$(grep -m 1 '<version>' pom.xml | sed 's/.*<version>\([^<]*\)<\/version>.*/\1/' | tr -d ' ')
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(git log -1 --format=%cI)
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION, SHA: $SHA"

      - name: Determine Docker tags
        id: tags
        run: |
          TAGS_CSV=""
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            # Version tag: use the tag version (strip 'v' prefix if present)
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG_VERSION"
            TAGS_CSV="$TAG"
            echo "Tags: $TAG (from git tag)"
          else
            # Master branch (workflow_run): use latest + commit SHA
            TAG_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            TAG_SHA="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.sha }}"
            TAGS_CSV="$TAG_LATEST,$TAG_SHA"
            # Also tag with Maven version if not SNAPSHOT
            if [[ ! "${{ steps.metadata.outputs.version }}" =~ -SNAPSHOT$ ]]; then
              TAG_VERSION="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.version }}"
              TAGS_CSV="$TAGS_CSV,$TAG_VERSION"
            fi
            echo "Tags: $TAGS_CSV (master branch)"
          fi
          echo "tags=$TAGS_CSV" >> "$GITHUB_OUTPUT"

      - name: Format tags for metadata-action
        id: format-tags
        run: |
          # Convert comma-separated tags to multiline format for metadata-action
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          {
            echo 'tags<<EOF'
            echo 'type=raw'
            for tag in "${TAG_ARRAY[@]}"; do
              echo "value=$tag"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.format-tags.outputs.tags }}
          # Disable automatic tag generation (we use custom tags)
          flavor: |
            suffix=
          # Custom labels/annotations
          labels: |
            org.opencontainers.image.title=JMusicBot
            org.opencontainers.image.description=A cross-platform Discord music bot with a clean interface
            org.opencontainers.image.url=https://jmusicbot.com
            org.opencontainers.image.source=https://github.com/arif-banai/MusicBot
            org.opencontainers.image.vendor=JMusicBot
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.timestamp }}
        env:
          # Set annotations at index level for multi-arch images (required for GHCR to display description)
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push Docker image
        id: build
        uses: ./.github/actions/docker-build
        with:
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          version: ${{ steps.metadata.outputs.version }}
          sha: ${{ steps.metadata.outputs.sha }}
          timestamp: ${{ steps.metadata.outputs.timestamp }}
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
